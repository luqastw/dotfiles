backend = "glx";
vsync = true;

# Fade — short and snappy (~70ms), applies to all windows including dunst popups
fading = true;
fade-in-step = 0.15;
fade-out-step = 0.15;
fade-delta = 10;

# Opacity
inactive-opacity = 1;
active-opacity = 1;
frame-opacity = 1;

opacity-rule = [
    "90:class_g = 'Alacritty' && focused",
    "85:class_g = 'Alacritty' && !focused",
    "100:window_type = 'dock'",
    "100:class_g = 'Rofi'",
    "100:fullscreen"
];

# Blur
blur-method = "dual_kawase";
blur-strength = 2;
blur-background = true;
blur-background-fixed = true;
blur-background-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "override_redirect = true"
];
