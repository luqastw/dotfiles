# Autostart — runs once per session
exec_always --no-startup-id xrdb -merge ~/.Xresources
exec --no-startup-id dex --autostart --environment i3
exec --no-startup-id xss-lock --transfer-sleep-lock -- betterlockscreen --lock dimblur --nofork
exec --no-startup-id unclutter --timeout 3
exec --no-startup-id dunst
exec --no-startup-id thunar --daemon
exec --no-startup-id /usr/lib/kwalletd5
exec --no-startup-id /usr/lib/polkit-kde-authentication-agent-1
exec --no-startup-id fcitx -d

# Pre-spawn the dropdown scratchpad terminal so the first $mod+minus is instant
exec --no-startup-id alacritty --class scratchterm

# These re-run on every reload/restart ($mod+Shift+c) — must stay idempotent.
# picom: kill any existing instance first, otherwise reload leaks a process per run.
exec_always --no-startup-id "pkill -x picom; picom"
exec_always --no-startup-id nitrogen --restore
