# Window rules — extend with `xprop | grep CLASS` on any app you want matched.
for_window [class="^Pavucontrol$"] floating enable
for_window [class="^Nitrogen$"] floating enable
for_window [window_role="pop-up"] floating enable
for_window [window_type="dialog"] floating enable

# Dropdown scratchpad terminal — spawned/toggled by scripts/scratchpad_toggle.sh
for_window [instance="scratchterm"] floating enable, resize set 80 ppt 60 ppt, move position center, move scratchpad

# Auto-assign example — uncomment and adjust to pin an app to a workspace
# assign [class="^Firefox$"] $ws2
