# Launchers
bindsym $mod+Return exec $term
bindsym $mod+d exec --no-startup-id rofi -show drun
bindsym $mod+c kill

# Screenshots — copied to clipboard, notify-send confirms since there's no other feedback
bindsym $mod+F11 exec --no-startup-id maim | xclip -selection clipboard -t image/png && notify-send -i camera-photo "Screenshot" "Full screen copied to clipboard"
bindsym $mod+Shift+F11 exec --no-startup-id maim -s | xclip -selection clipboard -t image/png && notify-send -i camera-photo "Screenshot" "Selection copied to clipboard"

# Floating / drag
floating_modifier $mod
tiling_drag modifier titlebar

# Focus
bindsym $mod+j focus down
bindsym $mod+k focus up
bindsym $mod+l focus right
bindsym $mod+h focus left

# Move
bindsym $mod+Shift+j move down
bindsym $mod+Shift+k move up
bindsym $mod+Shift+l move right
bindsym $mod+Shift+h move left

# Layout
bindsym $mod+Shift+v split h
bindsym $mod+v split v
bindsym $mod+f fullscreen toggle
bindsym $mod+s layout stacking
bindsym $mod+w layout tabbed
bindsym $mod+e layout toggle split
bindsym $mod+Shift+space floating toggle
bindsym $mod+space focus mode_toggle
bindsym $mod+a focus parent

# Scratchpad
# minus: toggle the dedicated dropdown terminal (auto-spawns if not running)
# Shift+minus: stash any focused window into the general scratchpad pool
# equal: cycle through stashed windows in the general pool (press again for the next one)
bindsym $mod+minus exec --no-startup-id ~/.config/i3/scripts/scratchpad_toggle.sh
bindsym $mod+Shift+minus move scratchpad
bindsym $mod+equal scratchpad show

# Session
bindsym $mod+Shift+c reload
bindsym $mod+Shift+r restart
bindsym $mod+Shift+e exec "i3-nagbar -t warning -m 'You pressed the exit shortcut. Do you really want to exit i3? This will end your X session.' -B 'Yes, exit i3' 'i3-msg exit'"

# Volume (PulseAudio)
bindsym XF86AudioRaiseVolume exec --no-startup-id pactl set-sink-volume @DEFAULT_SINK@ +5% && pkill -RTMIN+1 i3blocks
bindsym XF86AudioLowerVolume exec --no-startup-id pactl set-sink-volume @DEFAULT_SINK@ -5% && pkill -RTMIN+1 i3blocks
bindsym XF86AudioMute exec --no-startup-id pactl set-sink-mute @DEFAULT_SINK@ toggle && pkill -RTMIN+1 i3blocks
