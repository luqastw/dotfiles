# Pointer / touchpad tuning (device IDs from `xinput list`)
exec --no-startup-id xinput set-prop '8' 'libinput Accel Speed' -0.5
exec --no-startup-id xinput set-prop '8' 'libinput Accel Profile Enabled' 0 1 0
exec --no-startup-id xinput set-prop 13 'libinput Tapping Enabled' 1

# Re-applied on every reload — device property some drivers reset
exec_always --no-startup-id xinput set-prop 13 338 1
